name: J-Quants Data Batch

on:
  workflow_dispatch:
    inputs:
      run_fundamentals:
        description: 'ファンダメンタルズを取得'
        type: boolean
        default: true
      run_prices:
        description: '株価データを取得'
        type: boolean
        default: true
      run_earnings:
        description: '決算カレンダーを取得'
        type: boolean
        default: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas

      - name: Fetch Fundamentals
        # スケジュール実行時、または手動実行でチェックを入れた場合のみ起動
        if: ${{ github.event_name == 'schedule' || inputs.run_fundamentals == true }}
        run: python fetch_fundamentals.py

      - name: Fetch Prices
        if: ${{ github.event_name == 'schedule' || inputs.run_prices == true }}
        run: python fetch_prices.py

      - name: Fetch Earnings Calendar
        if: ${{ github.event_name == 'schedule' || inputs.run_earnings == true }}
        run: python fetch_earnings.py

      - name: Commit and Push DB files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *_db.pkl.gz
          git commit -m "Auto-update J-Quants DB files" || echo "No changes to commit"
          git push

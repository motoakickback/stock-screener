name: 🌙 19:00 Daily Fundamentals Fetch

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    # 🚨【超重要】GitHubの環境セキュリティを突破するための結線
    # ※もしGitHub側で特にEnvironmentを作っていない場合は、下記の一行を削除しても動きますが、
    # 遮断されている場合はここを指定することでSecretsが通るようになります。
    environment: 
      name: production
      url: https://github.com

    env:
      JQUANTS_MAIL: ${{ secrets.JQUANTS_MAIL }}
      JQUANTS_PASS: ${{ secrets.JQUANTS_PASS }}

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 必要なライブラリのインストール
        run: |
          pip install requests pandas

      - name: 🚀 兵站Botの実行（データ収集）
        run: python fetch_fundamentals_bot.py

      - name: 💾 取得したデータをGitHubへ保存（プッシュ）
        run: |
          if [ -f fundamentals_db.pkl ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add fundamentals_db.pkl
            git commit -m "🤖 自動補給: ファンダメンタルズDBの更新" || echo "変更なし"
            git push
          else
            echo "❌ エラー: fundamentals_db.pkl が生成されていません。"
            exit 1
          fi

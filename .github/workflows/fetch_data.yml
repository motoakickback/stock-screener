name: 🌙 18:00 Daily Fundamentals Fetch

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 必要なライブラリのインストール
        run: |
          pip install requests pandas

      - name: 🚀 兵站Botの実行（データ収集）
        run: python fetch_fundamentals_bot.py

      - name: 💾 取得したデータをGitHubへ保存（プッシュ）
        run: |
          if [ -f fundamentals_db.pkl ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add fundamentals_db.pkl
            git commit -m "🤖 自動補給: ファンダメンタルズDBの更新" || echo "変更なし"

            # 🚨 修正：株価データ（prices_db.pkl）も一緒に持ち帰るように指示を追加
            git add fundamentals_db.pkl prices_db.pkl
            git commit -m "🤖 自動補給: ファンダメンタルズDB・株価DBの更新" || echo "変更なし"
            
            # 🛡️ リモートの最新状態を安全に取り込んでからプッシュする防弾パッチ
            git pull --rebase origin main || echo "No rebase needed"
            
            git push origin main
          else
            echo "❌ エラー: fundamentals_db.pkl が生成されていません。"
            exit 1
          fi

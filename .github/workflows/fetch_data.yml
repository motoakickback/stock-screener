name: 🌙 19:00 Daily Fundamentals Fetch

on:
  schedule:
    # 毎日 UTC 10:00 (日本時間 19:00) に自動実行
    - cron: '0 10 * * *'
  workflow_dispatch: # 手動で「今すぐ実行」ボタンを押せるようにする設定

permissions:
  contents: write
  actions: read    # 🎯 追加: Secrets等へのアクセス権限を強化

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 必要なライブラリのインストール
        run: |
          pip install requests pandas

      - name: 🚀 兵站Botの実行（データ収集）
        # 🎯 変更: コマンドラインの直前で変数を注入する最も確実な手法
        run: |
          export JQUANTS_MAIL="${{ secrets.JQUANTS_MAIL }}"
          export JQUANTS_PASS="${{ secrets.JQUANTS_PASS }}"
          python fetch_fundamentals_bot.py

      - name: 💾 取得したデータをGitHubへ保存（プッシュ）
        run: |
          if [ -f fundamentals_db.pkl ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add fundamentals_db.pkl
            git commit -m "🤖 自動補給: ファンダメンタルズDBの更新" || echo "変更なし"
            git push
          else
            echo "❌ エラー: fundamentals_db.pkl が生成されていません。Botのログイン等に失敗した可能性があります。"
            exit 1
          fi

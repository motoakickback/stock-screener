name: 🌙 18:37 Daily Fundamentals Fetch

on:
  schedule:
    - cron: '13 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 必要なライブラリのインストール
        run: |
          pip install requests pandas

      - name: 🚀 兵站Botの実行（データ収集）
        run: python fetch_fundamentals_bot.py

      - name: 💾 取得したデータをGitHubへ保存（プッシュ）
        run: |
          # 🚨 圧縮ファイル（.pkl.gz）を指定するように変更
          if [ -f fundamentals_db.pkl.gz ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add fundamentals_db.pkl.gz prices_db.pkl.gz
            git commit -m "🤖 自動補給: 圧縮版ファンダ・株価DBの更新" || echo "変更なし"
            
            git pull --rebase origin main || echo "No rebase needed"
            
            git push origin main
          else
            echo "❌ エラー: fundamentals_db.pkl.gz が生成されていません。"
            exit 1
          fi
